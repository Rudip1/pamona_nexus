# =============================================================================
# pomona_navigation / config / nav2 / localization / amcl.yaml
# =============================================================================
# Adaptive Monte Carlo Localization — used only when localization:=amcl.
#
# Localizes the robot against a 2D occupancy grid (the map saved by pomona_slam,
# loaded by map_server) using the /scan from the 2D LiDAR. Publishes the
# map→odom transform. Provide an initial pose via RViz "2D Pose Estimate".
#
# MERGE CONTRACT: fragment — composed on top of nav2_base ⊕ controller ⊕ planner
# when localization == "amcl".
# =============================================================================

amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    update_min_a: 0.2
    update_min_d: 0.25
    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 5.0
    laser_min_range: 0.1
    max_beams: 60
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    save_pose_rate: 0.5
    tf_broadcast: true
    transform_tolerance: 1.0
    scan_topic: scan
